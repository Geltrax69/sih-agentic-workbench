name: workbench

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-workbench}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workbench}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workbench-dev-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:-workbench-dev-only}@postgres:5432/${POSTGRES_DB:-workbench}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-workbench-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-workbench}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workbench-dev-only}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef0123456789abcdef}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal-dev-only-change-me}
      AI_SERVICE_URL: http://ai:8000
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin#Dev1}
      MIGRATIONS_DIR: /migrations
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai:
    build: ./services/ai
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-llama3.2}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_ALLOW_CLOUD: ${AI_ALLOW_CLOUD:-false}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal-dev-only-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:-workbench-dev-only}@postgres:5432/${POSTGRES_DB:-workbench}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-workbench-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-workbench}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workbench-dev-only}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${WEB_PORT:-3000}"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - ./apps/web:/app
      - webnode:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  webnode:
