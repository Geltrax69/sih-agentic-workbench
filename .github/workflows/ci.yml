name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API — vet, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: test -z "$(gofmt -l .)"
        name: gofmt check
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...

  ai:
    name: Python AI service — compile, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest tests -q

  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration — API against postgres/redis/minio
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench-dev-only
          POSTGRES_DB: workbench_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://workbench:workbench-dev-only@localhost:5432/workbench_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: go test -tags=integration ./... -count=1
